<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Laughing Waters</title>
<link rel="manifest" href="field/manifest.json">
<script src="shared/tailwind.js"></script>
<link rel="stylesheet" href="shared/styles.css">
<script src="shared/api.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div id="setup" class="bg-white rounded-2xl shadow p-6 w-full max-w-sm">
  <div class="text-center mb-6">
    <div class="text-2xl font-bold" style="color: var(--lw-blue)">Laughing Waters</div>
    <div class="text-sm text-slate-500">Bekfontein Litchi Farm - Device Setup</div>
  </div>
  <label class="block text-sm font-medium text-slate-700 mb-1">This device's ID</label>
  <input id="deviceIdInput" list="deviceIds" placeholder="e.g. device-01"
         class="w-full border border-slate-300 rounded-lg p-3 mb-2 text-lg">
  <datalist id="deviceIds">
    <option value="device-01"></option>
    <option value="device-02"></option>
    <option value="device-03"></option>
    <option value="device-04"></option>
    <option value="device-05"></option>
    <option value="device-06"></option>
    <option value="device-07"></option>
    <option value="admin-pc"></option>
  </datalist>
  <div class="text-xs text-slate-400 mb-4">Ask the admin which ID belongs to this device. This is only needed once - the device remembers it after that.</div>
  <button id="continueBtn" class="w-full lw-btn-primary rounded-lg py-3 font-semibold">Continue</button>
  <div id="setupError" class="text-red-600 text-sm mt-3 hidden"></div>
</div>

<script>
async function routeDevice(deviceId) {
  const config = await LW.fetchDeviceConfig(deviceId);
  LW.setDeviceId(deviceId);
  const dest = {
    field: "field/",
    packhouse: "packhouse/",
    admin: "admin/",
  }[config.role] || "admin/";
  location.href = dest;
}

(async function init() {
  const existing = LW.getDeviceId();
  if (existing) {
    try {
      await routeDevice(existing);
      return;
    } catch (e) {
      LW.clearDeviceId(); // stale/unknown id, fall through to setup screen
    }
  }
  document.getElementById("continueBtn").addEventListener("click", async () => {
    const id = document.getElementById("deviceIdInput").value.trim();
    const errEl = document.getElementById("setupError");
    errEl.classList.add("hidden");
    if (!id) return;
    try {
      await routeDevice(id);
    } catch (e) {
      errEl.textContent = "Unknown device id. Check with the admin, or add this device in Master Data.";
      errEl.classList.remove("hidden");
    }
  });
})();
</script>
</body>
</html>
