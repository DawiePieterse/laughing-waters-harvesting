<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker QR Code</title>
<script src="../shared/qrcode.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: white; }
  .card { border: 2px solid #333; border-radius: 12px; padding: 24px; text-align: center; width: 240px; }
  .farm { font-size: 12px; color: #666; margin-bottom: 8px; }
  canvas { display: block; margin: 0 auto 12px; }
  .emp { font-size: 28px; font-weight: bold; letter-spacing: 2px; }
  .name { font-size: 16px; color: #333; margin-top: 4px; }
  @media print {
    .no-print { display: none; }
    body { padding: 0; margin: 0; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="farm">Laughing Waters – Bekfontein</div>
  <canvas id="qrCanvas"></canvas>
  <div class="emp" id="empNr"></div>
  <div class="name" id="workerName"></div>
</div>
<br>
<button class="no-print" onclick="window.print()" style="padding:10px 24px;font-size:16px;cursor:pointer;border:1px solid #333;border-radius:8px;background:#f0f0f0;">Print</button>

<script>
  const params = new URLSearchParams(location.search);
  const emp = params.get("emp") || "";
  const name = params.get("name") || "";
  document.getElementById("empNr").textContent = emp;
  document.getElementById("workerName").textContent = name;
  QRCode.toCanvas(document.getElementById("qrCanvas"), emp || "NO_ID", { width: 200, margin: 1 }, (err) => {
    if (err) console.error(err);
  });
</script>
</body>
</html>
